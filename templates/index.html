<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Simulator</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .log {
            margin-top: 20px;
            height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="my-4">Traffic Simulator</h1>
        <button id="run-script-btn" class="btn btn-primary mb-3">Send all OK</button>
        <div class="log border p-3" id="log">
            <p>Log:</p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        document.getElementById('run-script-btn').addEventListener('click', async () => {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = '<p>Output dello script</p><p>Executing...</p>';

            try {
                const response = await fetch('/run_script', { method: 'POST' });
                const data = await response.json();
                // Handle the response data

                if (data.status === 'success') {  
                    logDiv.innerHTML = '<p>Output</p>';  
                    data.output.forEach(line => {  
                        logDiv.innerHTML += `<p>${line}</p>`;  
                    });  
                } else {  
                    logDiv.innerHTML = `<p>Error: ${data.error}</p>`;  
                }  
            
            } catch (error) {
                logDiv.innerHTML += '<p>Error executing script</p>';
            }
        });
    </script>
</body>
</html>
